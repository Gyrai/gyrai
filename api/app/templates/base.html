<!doctype html><html><head><meta charset="utf-8"><title>{{ product }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/console.css"></head>
<body><header><div class="brand">{{ product }}<span>{{ org }}</span></div>
<nav><a href="/" {% if request.url.path=='/' %}class="active"{% endif %}>Dashboard</a><a href="/inventory" {% if request.url.path=='/inventory' %}class="active"{% endif %}>Inventory</a><a href="/events" {% if request.url.path=='/events' %}class="active"{% endif %}>Events</a><a href="/evidence" {% if request.url.path.startswith('/evidence') %}class="active"{% endif %}>Evidence</a><a href="/docs">API</a></nav>{% if user %}<div style="margin-left:auto;display:flex;gap:12px;align-items:center"><span class="muted">{{ user.username }} <span class="badge">{{ user.role }}</span></span><a href="/account/password" class="muted" style="font-size:12px">password</a><form method="post" action="/logout" style="margin:0"><button style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 10px;cursor:pointer">Sign out</button></form></div>{% endif %}</header>
<main>{% block body %}{% endblock %}</main></body></html>
