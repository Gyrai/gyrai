<!doctype html><html><head><meta charset="utf-8"><title>{{ product }} — sign in</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/console.css"></head>
<body><main style="max-width:380px;margin:12vh auto">
<div class="brand" style="font-size:18px;font-weight:600;margin-bottom:4px">{{ product }}</div>
<div class="muted" style="margin-bottom:20px">{{ org }}</div>
<form method="post" action="/login" class="ctl">
<input type="hidden" name="next" value="{{ next }}">
<label class="muted" style="font-size:12px">Username</label>
<input name="username" autocomplete="username" autofocus required style="width:100%;margin:4px 0 12px;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b0f14;color:var(--text)">
<label class="muted" style="font-size:12px">Password</label>
<input name="password" type="password" autocomplete="current-password" required style="width:100%;margin:4px 0 16px;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b0f14;color:var(--text)">
{% if error %}<p class="bad" style="margin:0 0 12px">{{ error }}</p>{% endif %}
<button type="submit" style="width:100%;padding:9px;border-radius:6px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer">Sign in</button>
</form>
<p class="muted" style="font-size:12px;margin-top:16px">Access to this console is recorded in the audit log.</p>
</main></body></html>
