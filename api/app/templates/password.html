{% extends "base.html" %}{% block body %}
<h1>Change password</h1>
{% if forced %}<p class="warn">You are using an initial password. Choose a new one to continue.</p>{% endif %}
<form method="post" action="/account/password" class="ctl" style="max-width:420px">
<label class="muted" style="font-size:12px">Current password</label>
<input name="current" type="password" autocomplete="current-password" required style="width:100%;margin:4px 0 12px;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b0f14;color:var(--text)">
<label class="muted" style="font-size:12px">New password (12+ characters)</label>
<input name="new" type="password" autocomplete="new-password" required minlength="12" style="width:100%;margin:4px 0 12px;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b0f14;color:var(--text)">
<label class="muted" style="font-size:12px">Confirm new password</label>
<input name="confirm" type="password" autocomplete="new-password" required minlength="12" style="width:100%;margin:4px 0 16px;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b0f14;color:var(--text)">
{% if error %}<p class="bad" style="margin:0 0 12px">{{ error }}</p>{% endif %}
<button type="submit" style="padding:9px 16px;border-radius:6px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer">Save</button>
</form>
{% endblock %}
